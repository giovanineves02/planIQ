spring.application.name=Backend

# Banco H2 em memoria para esta Sprint, so para a aplicacao subir sem depender
# de um PostgreSQL externo. A integracao definitiva com PostgreSQL fica para
# uma sprint futura (ver pom.xml).
spring.datasource.url=jdbc:h2:mem:ctiinsights;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
